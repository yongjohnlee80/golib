# ADR-0009 §2.9 requires a real Chromium/Firefox/WebKit run as a RELEASE GATE.
#
# It is a required check rather than an optional job because the capture-element
# text machine depends on behaviours the specs decline to promise, and synthetic
# dispatch is exactly what would hide a divergence. A suite that skips everywhere
# cannot satisfy an acceptance criterion.
name: browser matrix

# Pull requests merge into canary and run no CI (each has its VM43 gate and review); CI runs on
# each merge into canary, and on the milestone pull request that merges canary into main.
on:
  push:
    branches: [canary]
  pull_request:
    branches: [main]
    paths:
      - 'tui/web/**'
      - '.github/workflows/browser-matrix.yml'

permissions:
  contents: read

# Every repository of the account shares one pool of concurrent jobs, so CI runs only where it is
# read: a newer merge into canary cancels the older canary run (the newer tree holds it), and a
# newer push to the milestone pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request runs CI only when it is the milestone one, canary into main: any other into main
  # starts the workflow, but every job is skipped and holds no runner.
  matrix:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      # Every engine runs even when one fails: a divergence in WebKit is
      # information, and cancelling the others hides it.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tui/web/browsertest/package.json

      - name: install harness
        working-directory: tui/web/browsertest
        run: npm install --no-audit --no-fund

      - name: install ${{ matrix.browser }}
        working-directory: tui/web/browsertest
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: build the fixture server
        run: go build -o /tmp/webtui-fixture ./tui/web/browsertest/fixture

      - name: run ${{ matrix.browser }}
        working-directory: tui/web/browsertest
        run: npx playwright test --project=${{ matrix.browser }}

      - name: upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trace-${{ matrix.browser }}
          path: tui/web/browsertest/test-results/
          retention-days: 7

  # A single job the branch protection rule can require, so adding an engine to
  # the matrix does not mean editing the protection settings.
  gate:
    name: browser matrix (required)
    runs-on: ubuntu-latest
    needs: matrix
    if: always() && (github.event_name == 'push' || github.head_ref == 'canary')
    steps:
      - name: verify every engine passed
        run: |
          if [ "${{ needs.matrix.result }}" != "success" ]; then
            echo "::error::the browser matrix did not pass on every engine;" \
                 "ADR-0009 §2.9 makes this a release gate"
            exit 1
          fi
