# The Go gate: build, vet, gofmt and the race-enabled test suite.
#
# It exists because until now the only CI this repository had was the browser
# matrix, so "check CI before tagging" could say nothing about the Go code — and
# two flaky tests (a scaffold shutdown ordering bug and an rpc test that asserted
# off the wrong signal) sat in main precisely because nothing ran the suite more
# than once.
name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      # golib/gui is a nested module with Gio and cgo (ADR 1791330692): nothing in the root
      # module may depend on it, so a TUI binary never links Gio or needs a C toolchain.
      - name: root module stays cgo-free and Gio-free
        run: |
          CGO_ENABLED=0 go build ./...
          if go list -deps ./... | grep -E '^(gioui\.org|github\.com/yongjohnlee80/golib/gui)(/|$)'; then
            echo "::error::a root-module package depends on golib/gui or Gio"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The runner is Linux, so darwin-only files (vfs/local's no-replace syscall and Stat_t fields)
      # are never compiled or covered here; this at least builds and vets them.
      - name: vet (darwin)
        run: GOOS=darwin go vet ./...

      # -count=2 on purpose: a suite run once is a suite whose flakes are
      # someone else's problem later. Two runs in one job is the cheapest
      # pressure that catches the common ordering races.
      - name: test
        run: go test -race -count=2 -timeout 20m ./...

  # golib/gui: its own module, on Gio, with cgo. The root job never compiles it.
  gui:
    name: gui (Gio, cgo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache: true
          cache-dependency-path: gui/go.sum

      - name: Gio's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=2 -timeout 10m ./...

  # vfs/local watches with FSEvents on macOS, through cgo (ADR golib-vfs-0002): the Linux runner above
  # can only vet the cgo-less darwin build, so the watch itself is built and tested here, on a Mac.
  macos:
    name: macOS (cgo, vfs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build and vet (cgo)
        run: CGO_ENABLED=1 go vet ./vfs/...

      - name: "vet and test without cgo (no watch: the poll fallback)"
        run: CGO_ENABLED=0 go vet ./vfs/... && CGO_ENABLED=0 go test -count=1 ./vfs/...

      - name: test vfs (FSEvents)
        run: CGO_ENABLED=1 go test -race -count=2 -timeout 10m ./vfs/...

      # tui/pty's macOS open path (TIOCPTYGRANT/UNLK/GNAME) only runs here.
      - name: test tui/pty
        run: go test -race -count=2 -timeout 10m ./tui/pty/...

  coverage:
    name: coverage policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: generate head coverage
        run: >-
          go test -count=1 -timeout 20m -covermode=atomic
          -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage-head.out" ./...

      - name: generate base coverage
        run: |
          git worktree add --detach "$RUNNER_TEMP/coverage-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/coverage-base"
          go test -count=1 -timeout 20m -covermode=atomic \
            -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage-base.out" ./...

      - name: enforce coverage policy
        id: coverage_policy
        continue-on-error: true
        run: |
          set +e
          go run ./cmd/covercheck \
            --base-profile "$RUNNER_TEMP/coverage-base.out" \
            --head-profile "$RUNNER_TEMP/coverage-head.out" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --minimum-changed 70 \
            --maximum-total-regression 1 \
            --maximum-file-regression 1 \
            --require-changed-files \
            --format markdown > "$RUNNER_TEMP/coverage-report.md"
          status=$?
          cat "$RUNNER_TEMP/coverage-report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/coverage-report.md"
          exit "$status"

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: preserve coverage policy result
        if: steps.coverage_policy.outcome == 'failure'
        run: exit 1

  coverage-comment:
    name: coverage PR comment
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: download coverage report
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-report

      - name: create or update PR comment
        uses: actions/github-script@v7
        env:
          COVERAGE_REPORT_PATH: ${{ runner.temp }}/coverage-report/coverage-report.md
          COVERAGE_JOB_RESULT: ${{ needs.coverage.result }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- covercheck-report -->'
            const reportPath = process.env.COVERAGE_REPORT_PATH
            const reportAvailable = fs.existsSync(reportPath) && fs.statSync(reportPath).size > 0
            let report = reportAvailable
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : [
                  '## Coverage check: ERROR',
                  '',
                  'The coverage job did not produce a report. Open the workflow run for the generation error.',
                ].join('\n')

            const maxReportLength = 60000
            if (report.length > maxReportLength) {
              report = report.slice(0, maxReportLength) +
                '\n\n_Report truncated; open the workflow run for the complete output._'
            }

            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const headSHA = context.payload.pull_request.head.sha.slice(0, 7)
            const body = [
              marker,
              report,
              '',
              `<sub>Updated for \`${headSHA}\` · [workflow run](${runURL}) · coverage job: ${process.env.COVERAGE_JOB_RESULT}</sub>`,
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
