# The Go gate: build, vet, gofmt and the race-enabled test suite.
#
# It exists because until now the only CI this repository had was the browser
# matrix, so "check CI before tagging" could say nothing about the Go code — and
# two flaky tests (a scaffold shutdown ordering bug and an rpc test that asserted
# off the wrong signal) sat in main precisely because nothing ran the suite more
# than once.
name: go

# Pull requests merge into canary and run no CI (each has its VM43 gate and review); CI runs on
# each merge into canary, and on the milestone pull request that merges canary into main.
on:
  push:
    branches: [canary]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every repository of the account shares one pool of concurrent jobs, so CI runs only where it is
# read. A canary run is never cancelled: merges come faster than a run takes, so cancelling would
# never let one finish. A newer merge waits instead, and of the waiting runs only the newest is
# kept, so the run that starts next covers every merge since. A newer push to the milestone pull
# request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request runs CI only when it is the milestone one, canary into main: any other into main
  # starts the workflow, but every job is skipped and holds no runner.
  check:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      # golib/gui is a nested module with Gio and cgo (ADR 1791330692): nothing in the root
      # module may depend on it, so a TUI binary never links Gio or needs a C toolchain.
      - name: root module stays cgo-free and Gio-free
        run: |
          CGO_ENABLED=0 go build ./...
          if go list -deps ./... | grep -E '^(gioui\.org|github\.com/yongjohnlee80/gio|github\.com/yongjohnlee80/golib/gui)(/|$)'; then
            echo "::error::a root-module package depends on golib/gui or Gio"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The runner is Linux, so darwin-only files (vfs/local's no-replace syscall and Stat_t fields)
      # are never compiled or covered here; this at least builds and vets them.
      - name: vet (darwin)
        run: GOOS=darwin go vet ./...

      # A 32-bit int: a constant that fits 64 bits but not 32 builds on every runner and fails only
      # here, as tui/web's hostile-size table did from 2026-08-22 until this step.
      - name: vet (386)
        run: GOARCH=386 go vet ./...

      # -count=2 on purpose: a suite run once is a suite whose flakes are
      # someone else's problem later. Two runs in one job is the cheapest
      # pressure that catches the common ordering races.
      - name: test
        run: go test -race -count=2 -timeout 20m ./...

  # golib/gui: its own module, on Gio, with cgo. The root job never compiles it.
  gui:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: gui (Gio, cgo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: gui/go.mod
          cache: true
          cache-dependency-path: gui/go.sum

      # Against this commit's golib, not the released one gui/go.mod requires: a change to tui and
      # to gui lands in one PR. Releasing tags golib first, then raises gui/go.mod's requirement.
      - name: use this commit's golib
        run: go work init . ..

      - name: Gio's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=2 -timeout 10m ./...

  # The dao suites against real servers: PostgreSQL 18 with pgvector (two-phase commit on) and
  # MySQL 8.4, with the integration tag. Without them every database test skips, and the 10
  # integration-tagged files had stopped compiling with nobody the wiser. The script fails on a
  # skip that names a service it provides, so a server that never came up cannot pass as green.
  integration:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: dao integration (PostgreSQL, MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: dao against PostgreSQL 18 + pgvector and MySQL 8.4
        run: .github/scripts/integration.sh

      - name: the full log
        if: always()
        run: cat integration.log

  # golib/dao/bigquery: its own module (the GCP SDK), which no other job compiles. Against this
  # commit's golib, as gui is: its go.mod requires an older release, so a break would show only
  # when that requirement is raised. The integration tests need a GCP project and stay tagged out.
  bigquery:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: dao/bigquery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dao/bigquery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: dao/bigquery/go.mod
          cache: true
          cache-dependency-path: dao/bigquery/go.sum

      - name: use this commit's golib
        run: go work init . ../..

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=2 -timeout 10m ./...

  # Static analysis and known vulnerabilities, for each of the three modules. Pinned tools, so a
  # new release cannot turn main red on its own: raise a pin in a PR that fixes what it reports.
  # staticcheck reads staticcheck.conf (the default checks, less what it says, with why).
  # govulncheck reports only vulnerabilities golib's code can reach, so every finding is one to
  # fix, by raising the dependency or the toolchain.
  lint:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: staticcheck, govulncheck
    runs-on: ubuntu-latest
    env:
      STATICCHECK_VERSION: "2025.1.1"
      GOVULNCHECK_VERSION: "v1.9.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # staticcheck type-checks gui with cgo, so it needs Gio's headers as the gui job does.
      - name: Gio's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: install the tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION"
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"

      - name: staticcheck (golib)
        run: staticcheck ./...

      # against this commit's golib, as the gui and bigquery jobs build them
      - name: staticcheck (gui, dao/bigquery)
        run: |
          (cd gui && go work init . .. && staticcheck ./...; status=$?; rm -f go.work go.work.sum; exit $status)
          (cd dao/bigquery && go work init . ../.. && staticcheck ./...; status=$?; rm -f go.work go.work.sum; exit $status)

      # On the milestone pull request into main, each module against the versions its go.mod requires:
      # what a consumer would build. On canary, gui and dao/bigquery may use golib API that is not
      # tagged yet (gui's go.mod is raised only after the golib tag), so there they are checked
      # against this commit's golib, as the staticcheck step builds them.
      - name: govulncheck
        env:
          CONSUMER_VIEW: ${{ github.event_name == 'pull_request' }}
        run: |
          govulncheck ./...
          for m in gui:.. dao/bigquery:../..; do
            dir=${m%%:*}; root=${m#*:}
            if [ "$CONSUMER_VIEW" = "true" ]; then
              (cd "$dir" && govulncheck ./...)
            else
              (cd "$dir" && go work init . "$root" && govulncheck ./...; status=$?; rm -f go.work go.work.sum; exit $status)
            fi
          done

  # golib/gui on macOS: the Metal paths only compile on a Mac. examples/scene3d's Metal producer
  # renders into IOSurfaces that a headless Metal window draws without a copy, checked against the
  # CPU's picture.
  gui-macos:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: gui (macOS, Metal)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: gui/go.mod
          cache: true
          cache-dependency-path: gui/go.sum

      - name: use this commit's golib
        run: go work init . ..

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test scene3d (Metal producer, IOSurface frames)
        run: go test -race -count=1 -timeout 10m -v ./examples/scene3d/

  # vfs/local watches with FSEvents on macOS, through cgo (ADR golib-vfs-0002): the Linux runner above
  # can only vet the cgo-less darwin build, so the watch itself is built and tested here, on a Mac.
  macos:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: macOS (cgo, vfs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build and vet (cgo)
        run: CGO_ENABLED=1 go vet ./vfs/...

      - name: "vet and test without cgo (no watch: the poll fallback)"
        run: CGO_ENABLED=0 go vet ./vfs/... && CGO_ENABLED=0 go test -count=1 ./vfs/...

      - name: test vfs (FSEvents)
        run: CGO_ENABLED=1 go test -race -count=2 -timeout 10m ./vfs/...

      # tui/pty's macOS open path (TIOCPTYGRANT/UNLK/GNAME) only runs here.
      - name: test tui/pty
        run: go test -race -count=2 -timeout 10m ./tui/pty/...

  # An API report, information only (README, "Versioning and stability"): apidiff on each module
  # from the merge base to this commit, written to the run's summary. While golib is alpha it never
  # fails; at public promotion it becomes the gate for "breaking means a minor". The base is the
  # previous canary commit on a push, and main on the milestone pull request.
  apidiff:
    if: github.event_name == 'push' || github.head_ref == 'canary'
    name: API report (information only)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      BEFORE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # the gui module's packages load with cgo, as its own job builds them
      - name: Gio's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e

      - name: report
        run: |
          set -u
          say() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            say "No base commit to compare against ($BEFORE)."
            exit 0
          fi
          base=$(git merge-base "$BEFORE" HEAD)
          if ! git worktree add --detach "$RUNNER_TEMP/base" "$base"; then
            say "The base commit $base could not be checked out: no report."
            exit 0
          fi
          say "## API changes $(git rev-parse --short "$base")..$(git rev-parse --short HEAD)"
          # the nested modules load against the same commit's golib in each tree, as their own jobs do
          for tree in . "$RUNNER_TEMP/base"; do
            if [ -f "$tree/gui/go.mod" ]; then (cd "$tree/gui" && go work init . ..); fi
            if [ -f "$tree/dao/bigquery/go.mod" ]; then (cd "$tree/dao/bigquery" && go work init . ../..); fi
          done
          for mod in . gui dao/bigquery; do
            path=$(cd "$mod" && GOWORK=off go list -m) # a workspace would list every module in it
            say "### $path"
            if [ ! -f "$RUNNER_TEMP/base/$mod/go.mod" ]; then
              say "A new module: nothing to compare."
              continue
            fi
            export_file="$RUNNER_TEMP/$(printf '%s' "$mod" | tr '/.' '__').export"
            if ! (cd "$RUNNER_TEMP/base/$mod" && apidiff -m -w "$export_file" "$path") > "$RUNNER_TEMP/base.log" 2>&1; then
              say "The base did not load:"; say '```'; cat "$RUNNER_TEMP/base.log" >> "$GITHUB_STEP_SUMMARY"; say '```'
              continue
            fi
            # stdout is the report; stderr carries notices (internal packages skipped), shown on failure
            if ! (cd "$mod" && apidiff -m "$export_file" "$path") > "$RUNNER_TEMP/diff.txt" 2> "$RUNNER_TEMP/diff.err"; then
              say "apidiff failed:"; say '```'; cat "$RUNNER_TEMP/diff.err" >> "$GITHUB_STEP_SUMMARY"; say '```'
            fi
            if [ -s "$RUNNER_TEMP/diff.txt" ]; then
              say '```'; cat "$RUNNER_TEMP/diff.txt" >> "$GITHUB_STEP_SUMMARY"; say '```'
            else
              say "No API change."
            fi
          done

  coverage:
    name: coverage policy
    if: github.event_name == 'pull_request' && github.head_ref == 'canary'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: generate head coverage
        run: >-
          go test -count=1 -timeout 20m -covermode=atomic
          -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage-head.out" ./...

      - name: generate base coverage
        run: |
          git worktree add --detach "$RUNNER_TEMP/coverage-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/coverage-base"
          go test -count=1 -timeout 20m -covermode=atomic \
            -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage-base.out" ./...

      # gui/ is a nested module (Gio, cgo): the root module's profile can never contain its files,
      # so --require-changed-files would report every one of them missing. Its own job (gui) runs
      # its tests; this policy measures the root module only.
      - name: enforce coverage policy
        id: coverage_policy
        continue-on-error: true
        run: |
          set +e
          go run ./cmd/covercheck \
            --base-profile "$RUNNER_TEMP/coverage-base.out" \
            --head-profile "$RUNNER_TEMP/coverage-head.out" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --minimum-changed 70 \
            --maximum-total-regression 1 \
            --maximum-file-regression 1 \
            --require-changed-files \
            --exclude '^gui/' \
            --format markdown > "$RUNNER_TEMP/coverage-report.md"
          status=$?
          cat "$RUNNER_TEMP/coverage-report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/coverage-report.md"
          exit "$status"

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: preserve coverage policy result
        if: steps.coverage_policy.outcome == 'failure'
        run: exit 1

  coverage-comment:
    name: coverage PR comment
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'canary' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: download coverage report
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-report

      - name: create or update PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COVERAGE_REPORT_PATH: ${{ runner.temp }}/coverage-report/coverage-report.md
          COVERAGE_JOB_RESULT: ${{ needs.coverage.result }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- covercheck-report -->'
            const reportPath = process.env.COVERAGE_REPORT_PATH
            const reportAvailable = fs.existsSync(reportPath) && fs.statSync(reportPath).size > 0
            let report = reportAvailable
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : [
                  '## Coverage check: ERROR',
                  '',
                  'The coverage job did not produce a report. Open the workflow run for the generation error.',
                ].join('\n')

            const maxReportLength = 60000
            if (report.length > maxReportLength) {
              report = report.slice(0, maxReportLength) +
                '\n\n_Report truncated; open the workflow run for the complete output._'
            }

            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const headSHA = context.payload.pull_request.head.sha.slice(0, 7)
            const body = [
              marker,
              report,
              '',
              `<sub>Updated for \`${headSHA}\` · [workflow run](${runURL}) · coverage job: ${process.env.COVERAGE_JOB_RESULT}</sub>`,
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
