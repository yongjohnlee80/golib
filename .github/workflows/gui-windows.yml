# golib/gui on Windows (Gio's Direct3D 11 backend; no cgo): the packages in
# .github/windows-gui-packages.txt, which may only grow. The goldens are Linux's and skip here.
#
# Two callers run this one job:
#   - go.yml, as it always has: each merge into canary, the release pull request into main, and a
#     run by hand (whose discover input it passes on);
#   - a pull request into canary that changes gui, so a Direct3D failure shows before the merge,
#     not after it on canary. Only this job runs there: the others stay the canary run's.
# A change to the root module that breaks gui on Windows only shows on canary: its paths are not
# listed below, since most pull requests touch them.
name: gui-windows

on:
  workflow_call:
    inputs:
      discover:
        description: run every gui package's tests and list those that pass on Windows
        type: boolean
        default: false
  pull_request:
    branches: [canary]
    paths:
      - 'gui/**'
      - '.github/windows-gui-packages.txt'
      - '.github/gui-packages-check.sh'
      - '.github/workflows/gui-windows.yml'

# a pull request from a fork runs here too: it reads, and is given no secret
permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run (as go.yml's release pull
# request does). Any other run is a group of its own and never cancelled, as go.yml's canary runs
# are not. Not named after github.workflow: called from go.yml, that is go.yml's name, and the
# group would be go.yml's own, waiting on itself.
concurrency:
  group: gui-windows-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gui-windows:
    name: gui (Windows, Direct3D)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: gui/go.mod
          cache: true
          cache-dependency-path: gui/go.sum
      - name: use this commit's golib
        run: go work init . ./gui
      - name: every tested gui package is listed
        run: cd gui && bash ../.github/gui-packages-check.sh ../.github/windows-gui-packages.txt
      - name: test the ported gui packages
        if: ${{ !inputs.discover }}
        run: |
          mapfile -t pkgs < <(grep -v '^[#!]' .github/windows-gui-packages.txt | sed 's/[[:space:]]*#.*//' | grep .)
          cd gui && go test -count=3 -timeout 20m "${pkgs[@]}"
      - name: discover which gui packages pass on Windows
        if: ${{ inputs.discover }}
        continue-on-error: true
        run: |
          cd gui
          go test -count=1 -timeout 30m -json ./... > "$RUNNER_TEMP/gui.json" || true
          echo "== gui packages that pass on Windows"
          jq -r 'select(.Action == "pass" and .Test == null) | .Package' "$RUNNER_TEMP/gui.json" | sort -u
          echo "== gui packages that fail on Windows"
          jq -r 'select(.Action == "fail" and .Test == null) | .Package' "$RUNNER_TEMP/gui.json" | sort -u
          echo "== failing tests"
          jq -r 'select(.Action == "fail" and .Test != null) | "\(.Package) \(.Test)"' "$RUNNER_TEMP/gui.json" | head -60
          echo "== the failing tests again, verbose"
          jq -r 'select(.Action == "fail" and .Test != null and (.Test | contains("/") | not)) | "\(.Package) \(.Test)"' "$RUNNER_TEMP/gui.json" | tr -d '\r' | sort -u |
            while read -r pkg test; do go test -count=1 -run "^${test}\$" -v "$pkg" 2>&1 | grep -E '_test.go:[0-9]+:|^(---|ok|FAIL|panic)' | head -40; done

